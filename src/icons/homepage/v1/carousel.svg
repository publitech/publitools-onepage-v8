<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Three cards in perspective/depth -->
  <rect x="8" y="14" width="18" height="24" rx="2" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
  <rect x="14" y="12" width="18" height="24" rx="2" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="2"/>
  <rect x="20" y="10" width="18" height="24" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2"/>
  
  <!-- Orange accent on front card -->
  <circle cx="29" cy="22" r="2" fill="#FF7A1A"/>
  <rect x="24" y="26" width="10" height="1.5" rx="0.75" fill="#FF7A1A" opacity="0.6"/>
  <rect x="24" y="29" width="8" height="1.5" rx="0.75" fill="currentColor" opacity="0.3"/>
  
  <!-- Indicator dots -->
  <circle cx="26" cy="32" r="1" fill="#FF7A1A"/>
  <circle cx="29" cy="32" r="1" fill="currentColor" opacity="0.3"/>
  <circle cx="32" cy="32" r="1" fill="currentColor" opacity="0.3"/>
</svg>