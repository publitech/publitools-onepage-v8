<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Central node - orange -->
  <circle cx="24" cy="24" r="4" fill="#FF7A1A"/>
  
  <!-- Connected modular nodes - constellation pattern -->
  <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="36" cy="12" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="12" cy="36" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="36" cy="36" r="3" fill="currentColor" opacity="0.6"/>
  
  <!-- Connecting lines -->
  <line x1="14.5" y1="13.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="33.5" y1="13.5" x2="27" y2="21" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="14.5" y1="34.5" x2="21" y2="27" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="33.5" y1="34.5" x2="27" y2="27" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Orange connection highlights -->
  <line x1="21" y1="21" x2="27" y2="21" stroke="#FF7A1A" stroke-width="2" opacity="0.7"/>
  <line x1="21" y1="27" x2="27" y2="27" stroke="#FF7A1A" stroke-width="2" opacity="0.7"/>
  
  <!-- Small accent squares on corners -->
  <rect x="10" y="10" width="1.5" height="1.5" fill="#FF7A1A" opacity="0.6"/>
  <rect x="36.5" y="10" width="1.5" height="1.5" fill="#FF7A1A" opacity="0.6"/>
</svg>