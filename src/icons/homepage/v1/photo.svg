<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Camera body - modular industrial design -->
  <rect x="10" y="14" width="28" height="20" rx="2" fill="currentColor" opacity="0.9"/>
  <rect x="14" y="18" width="8" height="2" rx="1" fill="currentColor" opacity="0.3"/>
  
  <!-- Lens module - orange accent circle -->
  <circle cx="26" cy="24" r="8" fill="currentColor" opacity="0.2"/>
  <circle cx="26" cy="24" r="6" stroke="currentColor" stroke-width="2.5" fill="none"/>
  <circle cx="26" cy="24" r="2.5" fill="#FF7A1A"/>
  
  <!-- Top module accent -->
  <rect x="12" y="10" width="6" height="4" rx="1" fill="currentColor" opacity="0.6"/>
  <circle cx="35" cy="19" r="1.5" fill="#FF7A1A"/>
  
  <!-- Base blocks -->
  <rect x="16" y="34" width="6" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="26" y="34" width="6" height="4" rx="1" fill="#FF7A1A" opacity="0.8"/>
</svg>