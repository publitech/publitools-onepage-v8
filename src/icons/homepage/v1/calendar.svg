<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Calendar body with binding -->
  <rect x="10" y="14" width="28" height="26" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2"/>
  
  <!-- Binding rings - orange -->
  <circle cx="16" cy="12" r="2.5" stroke="#FF7A1A" stroke-width="2" fill="none"/>
  <circle cx="24" cy="12" r="2.5" stroke="#FF7A1A" stroke-width="2" fill="none"/>
  <circle cx="32" cy="12" r="2.5" stroke="#FF7A1A" stroke-width="2" fill="none"/>
  <line x1="16" y1="12" x2="16" y2="16" stroke="#FF7A1A" stroke-width="2"/>
  <line x1="24" y1="12" x2="24" y2="16" stroke="#FF7A1A" stroke-width="2"/>
  <line x1="32" y1="12" x2="32" y2="16" stroke="#FF7A1A" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="10" y="14" width="28" height="5" fill="currentColor" opacity="0.2"/>
  
  <!-- Date grid with orange events -->
  <circle cx="16" cy="26" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="22" cy="26" r="1.5" fill="#FF7A1A"/>
  <circle cx="28" cy="26" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="16" cy="32" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="22" cy="32" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="28" cy="32" r="1.5" fill="#FF7A1A"/>
</svg>