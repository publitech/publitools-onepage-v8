<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Video camera body - modular design -->
  <rect x="8" y="16" width="20" height="16" rx="2" fill="currentColor" opacity="0.9"/>
  
  <!-- Lens -->
  <circle cx="18" cy="24" r="5" fill="currentColor" opacity="0.2"/>
  <circle cx="18" cy="24" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
  
  <!-- Recording indicator - orange -->
  <circle cx="24" cy="19" r="2" fill="#FF7A1A"/>
  
  <!-- Viewfinder module -->
  <path d="M28 20 L38 16 L38 32 L28 28 Z" fill="currentColor" opacity="0.7"/>
  <rect x="30" y="22" width="2" height="4" rx="0.5" fill="#FF7A1A" opacity="0.6"/>
  
  <!-- Base blocks -->
  <rect x="10" y="32" width="6" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="18" y="32" width="6" height="4" rx="1" fill="#FF7A1A" opacity="0.8"/>
</svg>