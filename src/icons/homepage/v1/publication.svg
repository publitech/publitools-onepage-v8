<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Clock face - modular circle -->
  <circle cx="24" cy="24" r="14" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Hour marks -->
  <rect x="23" y="12" width="2" height="3" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="33" y="23" width="3" height="2" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="23" y="33" width="2" height="3" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="12" y="23" width="3" height="2" rx="1" fill="currentColor" opacity="0.4"/>
  
  <!-- Orange arc indicator (timing) -->
  <path d="M24 10 A 14 14 0 0 1 38 24" stroke="#FF7A1A" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Clock hands - orange -->
  <line x1="24" y1="24" x2="24" y2="16" stroke="#FF7A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="30" y2="24" stroke="#FF7A1A" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="24" cy="24" r="2" fill="#FF7A1A"/>
  
  <!-- Base blocks -->
  <rect x="16" y="40" width="6" height="4" rx="1" fill="currentColor" opacity="0.4"/>
  <rect x="26" y="40" width="6" height="4" rx="1" fill="#FF7A1A" opacity="0.8"/>
</svg>