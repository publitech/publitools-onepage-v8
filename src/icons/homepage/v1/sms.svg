<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Smartphone body -->
  <rect x="14" y="8" width="20" height="32" rx="3" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Screen area -->
  <rect x="17" y="12" width="14" height="22" rx="1" fill="currentColor" opacity="0.05"/>
  
  <!-- Message lines -->
  <line x1="20" y1="18" x2="28" y2="18" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="22" x2="26" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="26" x2="28" y2="26" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Notification dot - orange -->
  <circle cx="28" cy="14" r="2.5" fill="#FF7A1A"/>
  
  <!-- Home button area -->
  <circle cx="24" cy="36" r="1.5" fill="currentColor" opacity="0.3"/>
</svg>