<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Calendar body -->
  <rect x="10" y="12" width="28" height="26" rx="2" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2"/>
  
  <!-- Binding rings - orange -->
  <circle cx="16" cy="10" r="2" fill="#FF7A1A"/>
  <circle cx="24" cy="10" r="2" fill="#FF7A1A"/>
  <circle cx="32" cy="10" r="2" fill="#FF7A1A"/>
  <line x1="16" y1="10" x2="16" y2="14" stroke="#FF7A1A" stroke-width="1.5"/>
  <line x1="24" y1="10" x2="24" y2="14" stroke="#FF7A1A" stroke-width="1.5"/>
  <line x1="32" y1="10" x2="32" y2="14" stroke="#FF7A1A" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="10" y="12" width="28" height="6" fill="currentColor" opacity="0.2"/>
  
  <!-- Date grid -->
  <circle cx="16" cy="24" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="24" cy="24" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="32" cy="24" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="16" cy="30" r="1.5" fill="#FF7A1A"/>
  <circle cx="24" cy="30" r="1.5" fill="currentColor" opacity="0.3"/>
  <circle cx="32" cy="30" r="1.5" fill="#FF7A1A"/>
</svg>