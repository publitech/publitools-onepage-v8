backend:
  name: github
  repo: publitech/publitools
  branch: main

media_folder: public/uploads
public_folder: /uploads
site_url: https://publitools.ai
display_url: https://publitools.ai

collections:
  - name: homepage
    label: Homepage V3
    editor:
      preview: false
    files:
      - name: fr
        label: Homepage France
        file: src/content/homepage/fr.json
        extension: json
        format: json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Meta description, widget: text }
              - { name: canonical, label: Canonical, widget: string }
          - { name: signupUrl, label: URL inscription globale, widget: string }
          - { name: assetBase, label: Base assets mobile V2, widget: string }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: h1, label: H1, widget: string }
              - { name: subheadline, label: Subheadline, widget: text }
              - label: Badges
                name: badges
                widget: list
                summary: "{{fields.title}} — {{fields.icon}}"
                fields:
                  - { name: title, label: Texte badge, widget: string }
                  - label: Icône
                    name: icon
                    widget: select
                    options:
                          - { label: "Photo (photo)", value: "photo" }
